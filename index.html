<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-top: 20px; }
        .links-container { margin: 30px auto; max-width: 400px; }
        
        /* Button Styles */
        .social-link { display: flex; align-items: center; justify-content: center; gap: 10px; background: #24292e; color: white; padding: 15px; margin: 10px 0; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .social-link:hover { background: #007acc; }
        .social-link img { width: 24px; height: 24px; object-fit: contain; }

        .music-container { margin: 40px auto; max-width: 600px; }
        iframe { border-radius: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Profile Header -->
    <!-- If your picture file ends in .png, change pfp.jpg to pfp.png below -->
    <img src="pfp.JPG" alt="Profile Picture" class="profile-img">
    <h1>Brayskii</h1>
    <p>Producer & Creator</p>

    <!-- Social Links with Image Logos -->
    <div class="links-container">
        <!-- Instagram Button -->
        <a href="https://www.instagram.com/prodbrayskii_/" class="social-link" target="_blank">
            <img src="iglogo.png" alt="Instagram"> Instagram
        </a>
        
        <!-- YouTube Button -->
        <a href="https://www.youtube.com/@prodbrayskii" class="social-link" target="_blank">
            <img src="https://wikimedia.org" alt="YouTube"> YouTube
        </a>
    </div>

    <!-- Music Section -->
    <div class="music-container">
        <h2>Listen to My Music</h2>
        
        <!-- Spotify Player (Replace with your own track link later if needed) -->
        <iframe src="https://spotify.com" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

        <!-- SoundCloud Player (Replace with your own track link later if needed) -->
        <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://soundcloud.com"></iframe>
    </div>

</body>
</html>
